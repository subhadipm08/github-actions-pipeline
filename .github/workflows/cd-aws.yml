name: Continuous Deployment (Direct Build on Aws Server)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-directly-on-server:
    runs-on: ubuntu-latest

    steps:
    # 🌟 Notice: We do NOT use actions/checkout here because the runner doesn't need the code!
    
    - name: Execute Remote SSH Commands on Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        script: |
          # Navigate into your application workspace directory on the server
          cd ~/github-actions-pipeline || (git clone git@github.com:${{ github.repository }}.git ~/github-actions-pipeline && cd ~/github-actions-pipeline)
          
          echo "🔄 Fetching latest code updates from main branch..."
          git checkout main
          git pull origin main
          
          echo "🚦 Stopping existing container stack to release resources..."
          docker compose down
          
          echo "🏗️ Building new image and launching containers directly on server..."
          docker compose up -d --build
          
          echo "⏳ Waiting for server processes to stabilize..."
          sleep 10
          
          echo "🔍 Running internal server health check validation..."
          curl --silent --fail http://localhost:${{secrets.PORT}}/ || (echo "❌ Production container crashed on boot! Printing logs:" && docker compose logs app && exit 1)
          
          echo "🚀 Deployment successfully completed entirely on target infrastructure!"